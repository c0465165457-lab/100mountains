    // Haversine 公式計算距離 (公尺)
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 打卡邏輯
    function checkIn() {
      const statusText = document.getElementById('status');
      statusText.innerHTML = "📡 正在讀取手機 GPS 定位...";

      if (!navigator.geolocation) {
        statusText.innerText = "❌ 您的裝置不支援 GPS 定位功能";
        return;
      }

      navigator.geolocation.getCurrentPosition(position => {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;
        
        let nearestMountain = null;
        let minDistance = Infinity;

        // 計算與 100 座山頭的最短距離
        mountains.forEach(m => {
          const dist = getDistance(userLat, userLng, m.lat, m.lng);
          if (dist < minDistance) {
            minDistance = dist;
            nearestMountain = m;
          }
        });

        // 判斷距離是否在 150 公尺容許範圍內
        if (minDistance <= 150) {
          statusText.innerHTML = `✅ 成功定位至 <b>${nearestMountain.name}</b>！<br>正在同步至雲端試算表...`;
          
          fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({
              userId: userProfile ? userProfile.userId : "Unknown",
              userName: userProfile ? userProfile.displayName : "山友",
              mountainName: nearestMountain.name,
              distance: minDistance
            })
          }).then(res => res.json()).then(data => {
            statusText.innerHTML = `🎉 <b>恭喜完成 ${nearestMountain.name} 打卡！</b><br>紀錄已成功儲存至試算表。`;
          }).catch(err => {
            statusText.innerHTML = `⚠️ 定位成功，但上傳資料時失敗（請檢查 GAS 部署權限）。`;
          });
        } else {
          statusText.innerHTML = `❌ <b>未進入打卡範圍</b><br>離你最近的小百岳是 <b>${nearestMountain.name}</b><br>目前距離約 <b>${Math.round(minDistance)}</b> 公尺（需在 150m 內）。`;
        }
      }, err => {
        statusText.innerHTML = "❌ 無法取得 GPS 座標，請確認瀏覽器已開啟定位權限服務。";
      }, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    }
